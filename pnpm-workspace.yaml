verifyDepsBeforeRun: install
minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "docs/**"
allowBuilds:
  esbuild: true
  sharp: true
packageExtensions:
  "@preact/preset-vite@2.8.2":
    dependencies:
      "@babel/code-frame": ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.6
  vitest: ^4.1.11
  vite-plus: ^0.2.9
  esbuild: ^0.28.2
  typescript: ^7.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@types/node": ^26.1.2
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
