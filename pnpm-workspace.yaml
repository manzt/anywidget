verifyDepsBeforeRun: install
minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "docs/**"
allowBuilds:
  esbuild: true
  sharp: true
packageExtensions:
  "@preact/preset-vite@2.8.2":
    dependencies:
      "@babel/code-frame": ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.5.0
  vitest: ^5.1.0
  vite-plus: ^1.5.0
  esbuild: ^0.28.2
  typescript: ^7.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.6
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
