verifyDepsBeforeRun: install
minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "docs/**"
allowBuilds:
  esbuild: true
  sharp: true
packageExtensions:
  "@preact/preset-vite@2.8.2":
    dependencies:
      "@babel/code-frame": ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.6
  vitest: ^4.1.10
  vite-plus: ^0.2.6
  esbuild: ^0.28.2
  typescript: ^7.0.2
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
